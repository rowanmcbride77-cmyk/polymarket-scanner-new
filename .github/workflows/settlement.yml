name: Settlement Qualification

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
  push:
    branches: [main]
    paths:
      - "scanner/wallet-positions.js"
      - "scanner/batch-audit.js"
      - "scanner/audit-wallet.js"
      - "scanner/settlement-evidence.js"
      - "scanner/settlement-evidence.test.js"
      - "scanner/qualify.js"
      - ".github/workflows/settlement.yml"
  workflow_run:
    workflows: ["Discover Polymarket Wallets & Consensus"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: write

concurrency:
  group: polymarket-settlement-fast
  cancel-in-progress: false

jobs:
  qualify-and-publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Confirm the latest 20K discovery snapshot is present
        run: |
          test -s data/discovery.json
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const data = JSON.parse(readFileSync("data/discovery.json", "utf8"));
          const wallets = Array.isArray(data.candidates)
            ? data.candidates.map((row) => String(row?.wallet ?? "").trim().toLowerCase())
            : [];
          if (data.schemaVersion !== 1 || data.validation?.passed !== true ||
              wallets.length === 0 ||
              wallets.length !== data.validation.candidateCount ||
              wallets.length > Number(data.validation.maxCandidates ?? 20000) ||
              wallets.some((wallet) => !/^0x[a-f0-9]{40}$/.test(wallet)) ||
              new Set(wallets).size !== wallets.length) {
            throw new Error("Latest wallet discovery snapshot is missing, over-cap, duplicated, or invalid");
          }
          console.log(`Using ${data.candidates.length} previously discovered wallets; discovery will not run again here.`);
          NODE
      - name: Check scanner and dashboard syntax
        run: npm run check
      - name: Run scanner unit tests
        run: npm test
      - name: Configure checkpoint commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Cancel the obsolete unbounded settlement run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel 45071450228 --repo "$GITHUB_REPOSITORY" || true
      - name: Qualify candidates using 30-day settlement evidence
        run: npm run qualify
        env:
          SCANNER_CONCURRENCY: 16
          SCANNER_AUDIT_LIMIT: 20000
          SCANNER_RUN_WALLET_LIMIT: 250
          SCANNER_API_INTERVAL_MS: 50
          SCANNER_POSITION_MAX_PAGES: 10
          SCANNER_DIAGNOSTIC_LIMIT: 0
          SCANNER_AUDIT_CHUNK_SIZE: 25
          SCANNER_PERSIST_CHECKPOINTS: 1
          NODE_OPTIONS: --max-old-space-size=6144 --expose-gc
      - name: Validate settlement-qualified dashboard data
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const status = JSON.parse(readFileSync("site/data/qualification-status.json", "utf8"));
          if (status.state === "partial" || status.state === "in_progress") {
            console.log("Checkpointed progress: " + status.auditedWallets + "/" + status.discoveredWallets + ". Waiting for the next scheduled batch.");
            process.exit(0);
          }
          if (status.state !== "success" || status.validation?.passed !== true ||
              status.validation?.complete !== true ||
              status.auditedWallets !== status.discoveredWallets) {
            throw new Error("Qualification status failed terminal-audit validation");
          }
          for (const period of ["week", "month"]) {
            const board = JSON.parse(readFileSync(`site/data/qualified-${period}.json`, "utf8"));
            if (board.period !== period || board.validation?.passed !== true ||
                board.validation?.complete !== true || !Array.isArray(board.traders) ||
                board.traders.length < 1 || board.count !== board.traders.length ||
                !board.traders.every((t, i) => t.rank === i + 1 &&
                  Number.isFinite(t.winRate) && t.winRate >= 0.9 &&
                  Number.isInteger(t.resolvedMarkets) && t.resolvedMarkets >= 10 &&
                  Number.isInteger(t.wins) && Number.isInteger(t.losses) &&
                  t.wins + t.losses === t.resolvedMarkets &&
                  Math.abs(t.winRate - t.wins / t.resolvedMarkets) < 1e-9 &&
                  Number.isFinite(t.leaderboardPnl))) {
              throw new Error(`${period}: settlement-qualified board failed validation`);
            }
          }
          console.log("Validated weekly and monthly boards: every displayed trader meets 90% / 10 resolved markets.");
          NODE
      - name: Commit qualified data for the fast Pages deploy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/qualification-progress.json site/data/qualification.json site/data/qualified-week.json site/data/qualified-month.json site/data/qualification-status.json
          if git diff --cached --quiet; then
            echo "Qualified data is unchanged; no commit needed."
          else
            git commit -m "Publish verified settlement-qualified trader boards"
            git fetch origin main
            git rebase -X theirs origin/main
            git push origin HEAD:main
          fi
