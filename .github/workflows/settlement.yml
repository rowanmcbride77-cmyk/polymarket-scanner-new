name: Settlement Qualification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/settlement.yml"
      - "scanner/wallet-positions.js"
      - "scanner/batch-audit.js"
      - "scanner/audit-wallet.js"
      - "scanner/settlement-evidence.js"
      - "scanner/settlement-evidence.test.js"
      - "scanner/qualify.js"
      - "scanner/top1000.js"
  workflow_run:
    workflows: ["Fetch Polymarket Top 1,000"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: write

concurrency:
  group: polymarket-settlement-fast
  # New scanner logic supersedes a stuck older run; preserve checkpoints before replacement.
  cancel-in-progress: false

jobs:
  qualify-and-publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Confirm the official Top 1,000 audit universe is present
        run: |
          test -s data/audit-universe.json
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const data = JSON.parse(readFileSync("data/audit-universe.json", "utf8"));
          const wallets = Array.isArray(data.candidates)
            ? data.candidates.map((row) => String(row?.wallet ?? "").trim().toLowerCase())
            : [];
          if (data.schemaVersion !== 1 || data.validation?.passed !== true ||
              wallets.length === 0 ||
              wallets.length !== data.validation.candidateCount ||
              wallets.length !== 1000 || data.validation?.complete !== true ||
              wallets.some((wallet) => !/^0x[a-f0-9]{40}$/.test(wallet)) ||
              new Set(wallets).size !== wallets.length) {
            throw new Error("Official Top 1,000 audit universe is missing, not exactly 1,000, duplicated, or invalid");
          }
          console.log(`Using exactly ${data.candidates.length} official Polymarket leaderboard wallets; no wallet discovery or random expansion will run.`);
          NODE
      - name: Check scanner and dashboard syntax
        run: npm run check
      - name: Run scanner unit tests
        run: npm test
      - name: Configure checkpoint commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Qualify candidates using 60-day closed-market results
        run: npm run qualify
        env:
          SCANNER_CONCURRENCY: 32
          SCANNER_AUDIT_LIMIT: 1000
           # Audit the fixed 1,000-wallet official leaderboard universe in one run.
          SCANNER_RUN_WALLET_LIMIT: 1000
          SCANNER_API_INTERVAL_MS: 52
          SCANNER_POSITION_MAX_PAGES: 10
          SCANNER_DIAGNOSTIC_LIMIT: 0
          SCANNER_AUDIT_CHUNK_SIZE: 20
          SCANNER_PERSIST_CHECKPOINTS: 1
          NODE_OPTIONS: --max-old-space-size=6144 --expose-gc
      - name: Validate settlement-qualified dashboard data
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const status = JSON.parse(readFileSync("site/data/qualification-status.json", "utf8"));
          if (status.state === "partial" || status.state === "in_progress") {
            console.log("Checkpointed progress: " + status.auditedWallets + "/" + status.discoveredWallets + ". Waiting for the next scheduled batch.");
            process.exit(0);
          }
          if (status.state !== "success" || status.validation?.passed !== true ||
              status.validation?.complete !== true ||
              status.auditedWallets !== status.discoveredWallets || status.discoveredWallets !== 1000 || status.sourceCandidateCount !== 1000 || status.earlyExitsIncluded !== false) {
            throw new Error("Qualification status failed terminal-audit validation");
          }
          for (const period of ["week", "month"]) {
            const board = JSON.parse(readFileSync(`site/data/qualified-${period}.json`, "utf8"));
            if (board.period !== period || board.validation?.passed !== true ||
                board.validation?.complete !== true || !Array.isArray(board.traders) ||
                board.count !== board.traders.length ||
                !board.traders.every((t, i) => t.rank === i + 1 &&
                  Number.isFinite(t.winRate) && t.winRate >= 0.9 &&
                  Number.isInteger(t.resolvedMarkets) && t.resolvedMarkets >= 10 &&
                  Number.isInteger(t.wins) && Number.isInteger(t.losses) &&
                  t.wins + t.losses === t.resolvedMarkets && t.earlyExitsCounted === 0 &&
                  Math.abs(t.winRate - t.wins / t.resolvedMarkets) < 1e-9 &&
                  Number.isFinite(t.leaderboardPnl))) {
              throw new Error(`${period}: settlement-qualified board failed validation`);
            }
          }
          console.log("Validated weekly and monthly boards: every displayed trader meets 90% / 10 resolved markets, and early exits are excluded.");
          NODE
      - name: Commit qualified data for the fast Pages deploy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/qualification-progress-60d.json site/data/qualification.json site/data/qualified-week.json site/data/qualified-month.json site/data/qualification-status.json
          if git diff --cached --quiet; then
            echo "Qualified data is unchanged; no commit needed."
          else
            git commit -m "Publish verified settlement-qualified trader boards"
            git fetch origin main
            git rebase -X theirs origin/main
            git push origin HEAD:main
          fi
