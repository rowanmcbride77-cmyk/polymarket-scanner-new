name: Qualified Trader Live Signals

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  workflow_run:
    workflows: ["Settlement Qualification"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: polymarket-qualified-live-signals
  cancel-in-progress: false

jobs:
  build-live-signals:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate scanner and tests
        run: |
          npm run check
          npm test
      - name: Wait for a complete settlement-qualified leaderboard
        id: qualification
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from "node:fs";
          const read = (path) => JSON.parse(readFileSync(path, "utf8"));
          const status = read("site/data/qualification-status.json");
          const ready = status.schemaVersion === 1 &&
            status.state === "success" &&
            status.validation?.passed === true &&
            status.validation?.complete === true &&
            status.auditedWallets === status.discoveredWallets &&\n            status.discoveredWallets === 1000 && status.sourceCandidateCount === 1000 &&\n            status.earlyExitsIncluded === false && status.qualification?.earlyExitsCounted === false;
          if (!ready) {
            console.log("Settlement audit is not complete (" +
              (status.auditedWallets ?? 0) + "/" +
              (status.discoveredWallets ?? 0) +
              "). Skipping live signals; this is expected while qualification is checkpointing.");
            await import("node:fs").then(({ appendFileSync }) =>
              appendFileSync(process.env.GITHUB_OUTPUT, "ready=false\n"));
            process.exit(0);
          }
          for (const period of ["week", "month"]) {
            const board = read(`site/data/qualified-${period}.json`);
            if (board.schemaVersion !== 1 || board.period !== period ||
                board.validation?.passed !== true || board.validation?.complete !== true ||
                !Array.isArray(board.traders) ||
                !board.traders.every((trader, index) =>
                  trader.rank === index + 1 && trader.winRate >= 0.9 &&
                  trader.resolvedMarkets >= 10 && trader.earlyExitsCounted === 0)) {
              throw new Error(period + " settlement-qualified board failed validation");
            }
          }
          await import("node:fs").then(({ appendFileSync }) =>
            appendFileSync(process.env.GITHUB_OUTPUT, "ready=true\n"));
          console.log("Both complete settlement-qualified boards are ready.");
          NODE
      - name: Build same-side signals from qualified traders and observe sells
        if: steps.qualification.outputs.ready == 'true'
        run: npm run consensus
        env:
          SCANNER_CONCURRENCY: 16
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Publish live signal and exit-alert data
        if: steps.qualification.outputs.ready == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/consensus.json site/data/consensus-status.json
          if git diff --cached --quiet; then
            echo "Live signals unchanged."
          else
            git commit -m "Publish qualified trader live copy signals"
            git fetch origin main
            git rebase -X theirs origin/main
            git push origin HEAD:main
          fi
