name: Refresh Fast Polymarket Top 100

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths:
      - "scanner/**"
      - "site/**"
      - "package.json"
      - ".github/workflows/top100.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: polymarket-qualified-top100-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check scanner and dashboard syntax
        run: npm run check
      - name: Run scanner unit tests
        run: npm test
      - name: Fetch weekly and monthly Top 100 directly from Polymarket
        run: npm run top100
      - name: Validate fast leaderboard output
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          for (const period of ["week", "month"]) {
            const board = JSON.parse(readFileSync(`site/data/${period}.json`, "utf8"));
            if (board.validation?.passed !== true || board.validation?.complete !== true ||
                !Array.isArray(board.traders) || board.traders.length !== 100 ||
                board.count !== 100 ||
                !board.traders.every((t, i) => t.rank === i + 1 &&
                  /^0x[a-f0-9]{40}$/i.test(t.wallet) && Number.isFinite(t.pnl))) {
              throw new Error(`${period}: invalid public Top 100 output`);
            }
          }
          const status = JSON.parse(readFileSync("site/data/status.json", "utf8"));
          if (status.state !== "success" || status.validation?.passed !== true) {
            throw new Error("Top 100 status validation failed");
          }
          console.log("Validated 100 weekly and 100 monthly public leaderboard entries.");
          NODE
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload dashboard and data
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy new scanner dashboard
        id: deployment
        uses: actions/deploy-pages@v4
