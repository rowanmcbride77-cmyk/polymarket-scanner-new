name: Deploy Polymarket Scanner Website

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths:
      - "scanner/**"
      - "site/**"
      - "!site/data/qualification-status.json"
      - "package.json"
      - ".github/workflows/top100.yml"
  workflow_run:
    workflows:
      - "Settlement Qualification"
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: polymarket-qualified-top100-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      # A rerun of a failed job can leave the previous attempt's artifact behind.
      # Unique names prevent deploy-pages from seeing multiple matching artifacts.
      PAGES_ARTIFACT_NAME: github-pages-attempt-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check scanner and dashboard syntax
        run: npm run check
      - name: Run scanner unit tests
        run: npm test
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload dashboard and data
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
          name: ${{ env.PAGES_ARTIFACT_NAME }}
      - name: Wait for uploaded Pages artifact to be visible to the Actions API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          const artifactName = process.env.PAGES_ARTIFACT_NAME;
          const url = `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}/artifacts?name=${encodeURIComponent(artifactName)}`;
          for (let attempt = 1; attempt <= 15; attempt++) {
            const response = await fetch(url, {
              headers: {
                Authorization: `Bearer ${process.env.GH_TOKEN}`,
                Accept: "application/vnd.github+json",
                "X-GitHub-Api-Version": "2022-11-28",
              },
            });
            if (!response.ok) throw new Error(`Artifact list returned HTTP ${response.status}`);
            const payload = await response.json();
            const matches = (payload.artifacts ?? []).filter(item => item.name === artifactName);
            if (matches.length === 1) {
              console.log(`Pages artifact ${matches[0].id} is visible after attempt ${attempt}; allowing the Pages service 10 seconds to index it.`);
              await new Promise(resolve => setTimeout(resolve, 10000));
              process.exit(0);
            }
            if (matches.length > 1) {
              throw new Error(`Expected one artifact named ${artifactName}, found ${matches.length}.`);
            }
            console.log(`Pages artifact not visible yet (attempt ${attempt}/15).`);
            await new Promise(resolve => setTimeout(resolve, 2000));
          }
          throw new Error("Uploaded Pages artifact did not become visible within 30 seconds.");
          NODE
      - name: Deploy new scanner dashboard
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}
