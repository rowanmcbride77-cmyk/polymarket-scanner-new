name: Build Settlement-Qualified Top 100

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths:
      - "scanner/**"
      - "site/**"
      - "package.json"
      - ".github/workflows/top100.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: polymarket-qualified-top100-pages
  cancel-in-progress: false

jobs:
  qualify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      SCANNER_MAX_CANDIDATES: 1000
      SCANNER_CONCURRENCY: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check scanner and dashboard syntax
        run: npm run check
      - name: Run scanner unit tests
        run: npm test
      - name: Discover candidate wallets from Polymarket weekly and monthly leaderboards
        run: npm run scan:discover
      - name: Audit candidates against 30-day settlement evidence and qualification rules
        run: npm run qualify
      - name: Publish qualified weekly and monthly boards into the new dashboard
        run: |
          mkdir -p site/data
          cp data/week.json site/data/week.json
          cp data/month.json site/data/month.json
          cp data/status.json site/data/status.json
          cp data/qualification.json site/data/qualification.json
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const qualification = JSON.parse(readFileSync("site/data/qualification.json", "utf8"));
          const status = JSON.parse(readFileSync("site/data/status.json", "utf8"));
          for (const period of ["week", "month"]) {
            const board = JSON.parse(readFileSync(`site/data/${period}.json`, "utf8"));
            if (board.validation?.passed !== true || !Array.isArray(board.traders) ||
                board.traders.length > 100 || board.count !== board.traders.length) {
              throw new Error(`${period}: malformed qualified leaderboard`);
            }
            for (const trader of board.traders) {
              if (!/^0x[a-f0-9]{40}$/i.test(trader.wallet) ||
                  !Number.isFinite(trader.winRate) || trader.winRate < 0.9 ||
                  !Number.isInteger(trader.resolvedMarkets) || trader.resolvedMarkets < 10 ||
                  trader.wins + trader.losses !== trader.resolvedMarkets ||
                  !Number.isFinite(trader.leaderboardPnl)) {
                throw new Error(`${period}: trader did not pass settlement qualification`);
              }
            }
          }
          if (qualification.qualification?.lookbackDays !== 30 ||
              qualification.qualification?.minimumWinRate !== 0.9 ||
              qualification.qualification?.minimumResolvedMarkets !== 10 ||
              qualification.qualification?.earlyExitsCounted !== false ||
              qualification.validation?.passed !== true ||
              status.qualifiedWallets !== qualification.validation.qualifiedWallets) {
            throw new Error("Qualification output or status failed final validation");
          }
          console.log(`Qualified Top 100 ready: weekly=${JSON.parse(readFileSync("site/data/week.json","utf8")).traders.length}; monthly=${JSON.parse(readFileSync("site/data/month.json","utf8")).traders.length}; qualified wallets=${qualification.validation.qualifiedWallets}`);
          NODE
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload qualified dashboard and data
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy new scanner dashboard
        id: deployment
        uses: actions/deploy-pages@v4
