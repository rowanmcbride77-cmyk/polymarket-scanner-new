name: Deploy Polymarket Scanner Website

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths:
      - "scanner/**"
      - "site/**"
      - "package.json"
      - ".github/workflows/top100.yml"
  workflow_run:
    workflows:
      - "Discover Polymarket Wallets & Consensus"
      - "Settlement Qualification"
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: polymarket-qualified-top100-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check scanner and dashboard syntax
        run: npm run check
      - name: Run scanner unit tests
        run: npm test
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload dashboard and data
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy new scanner dashboard
        id: deployment
        uses: actions/deploy-pages@v4
