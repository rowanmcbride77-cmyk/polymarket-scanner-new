name: Fetch Polymarket Top 1,000

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scanner/top1000.js"
      - "scanner/data-api.js"
      - "package.json"
      - ".github/workflows/qualified.yml"
  schedule:
    - cron: "47 */6 * * *"

permissions:
  contents: write

concurrency:
  group: polymarket-leaderboard-universe
  cancel-in-progress: false

jobs:
  fetch-leaderboard-universe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check scanner syntax and tests
        run: |
          npm run check
          npm test
      - name: Fetch and validate exactly 1,000 official leaderboard wallets
        run: npm run top1000
        env:
          NODE_OPTIONS: --max-old-space-size=2048
      - name: Publish validated 1,000-wallet audit universe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/audit-universe.json site/data/audit-universe-status.json
          git commit -m "Publish official Polymarket Top 1,000 audit universe"
          git fetch origin main
          git rebase -X theirs origin/main
          git push origin HEAD:main
