name: Discover Polymarket Wallets & Consensus

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scanner/**"
      - "!scanner/qualify.js"
      - "!scanner/wallet-positions.js"
      - "!scanner/batch-audit.js"
      - "!scanner/audit-wallet.js"
      - "!scanner/settlement-evidence.js"
      - "!scanner/settlement-evidence.test.js"
      - "!scanner/consensus-run.js"
      - "!scanner/qualification-runner.js"
      - "!.github/workflows/qualified.yml"
  schedule:
    - cron: "47 */6 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: polymarket-pipeline
  cancel-in-progress: false

jobs:
  discover-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check scanner and dashboard syntax
        run: npm run check
      - name: Run scanner unit tests
        run: npm test
      - name: Discover candidate wallets from Polymarket
        run: npm run scan
        env:
          SCANNER_MAX_CANDIDATES: 20000
          NODE_OPTIONS: --max-old-space-size=6144
      - name: Build broad same-side consensus from all 20,000 discovered wallets
        run: npm run consensus
        env:
          SCANNER_CONCURRENCY: 32
          NODE_OPTIONS: --max-old-space-size=6144
      - name: Publish broad consensus immediately, before slower settlement qualification
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/discovery.json site/data/consensus.json site/data/consensus-status.json
          if git diff --cached --quiet; then
            echo "Consensus data unchanged."
          else
            git commit -m "Publish full-pool 20K wallet consensus"
            # Other GitHub Actions can advance main while the 20K scan is running.
            # Rebase this generated snapshot onto the latest main before pushing.
            # Prefer this run's freshly generated discovery/consensus outputs on conflict.
            git fetch origin main
            git rebase -X theirs origin/main
            git push origin HEAD:main
          fi
