name: Qualified consensus

on:
  workflow_run:
    workflows: ["Live candidate discovery and qualification"]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: polymarket-consensus
  cancel-in-progress: true

jobs:
  consensus:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download validated qualification artifact
        uses: actions/download-artifact@v4
        with:
          name: polymarket-qualified-scanner-output
          path: data
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Run tests and syntax checks
        run: |
          npm test
          npm run check
      - name: Verify or build consensus
        run: |
          if [ -s data/consensus.json ] && [ -s data/status.json ]; then
            node -e "const c=require('./data/consensus.json'); const s=require('./data/status.json'); if(c.validation?.passed!==true || s.validation?.passed!==true || s.state!=='success') process.exit(1)"
            echo "Qualification artifact already contains validated consensus."
          else
            npm run consensus
          fi
        env:
          SCANNER_CONCURRENCY: 16
      - name: Upload final validated scanner output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: polymarket-final-output
          path: |
            data/discovery.json
            data/qualification.json
            data/week.json
            data/month.json
            data/consensus.json
            data/status.json
            data/consensus-incomplete.json
          if-no-files-found: ignore
          retention-days: 14
