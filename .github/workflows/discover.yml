name: Live candidate discovery and qualification

on:
  push:
    branches: [main]
    paths:
      - "scanner/wallet-positions.js"
      - "scanner/audit-wallet.js"
      - ".github/workflows/discover.yml"
  workflow_dispatch:

concurrency:
  group: polymarket-candidate-discovery
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  discover-and-qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run tests and syntax checks
        run: |
          npm test
          npm run check
      - name: Discover 20,000 candidate wallets
        run: npm run scan
      - name: Audit settlements and build qualified weekly/monthly Top 100
        run: npm run qualify
        env:
          SCANNER_CONCURRENCY: 16
          NODE_OPTIONS: --max-old-space-size=6144
      - name: Upload validated scanner outputs and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: polymarket-qualified-scanner-output
          path: |
            data/discovery.json
            data/qualification.json
            data/qualification-incomplete.json
            data/week.json
            data/month.json
            data/consensus.json
            data/status.json
          if-no-files-found: ignore
          retention-days: 14
