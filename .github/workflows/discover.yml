name: Live candidate discovery and qualification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/discover.yml"
      - "scanner/**"
      - "package.json"

concurrency:
  group: polymarket-candidate-discovery-v3
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  discover-and-qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run tests and syntax checks
        run: |
          npm test
          npm run check
      - name: Discover up to 20,000 candidate wallets
        run: npm run scan
      - name: Verify settlements and build qualified monthly Top 100
        run: npm run qualify
        env:
          SCANNER_CONCURRENCY: 12
          SCANNER_API_INTERVAL_MS: 100
          NODE_OPTIONS: --max-old-space-size=6144
      - name: Build same-side consensus and high-multiplier combos
        run: npm run consensus
        env:
          SCANNER_CONCURRENCY: 12
          NODE_OPTIONS: --max-old-space-size=6144
      - name: Upload validated scanner outputs and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: polymarket-qualified-scanner-output
          path: |
            data/discovery.json
            data/qualification.json
            data/qualification-incomplete.json
            data/week.json
            data/month.json
            data/consensus.json
            data/status.json
          if-no-files-found: ignore
          retention-days: 14
