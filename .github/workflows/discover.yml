name: Live candidate discovery

on:
  push:
    branches: [main]
    paths:
      - "scanner/**"
      - "package.json"
      - ".github/workflows/discover.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run tests and syntax checks
        run: |
          npm test
          npm run check
      - name: Discover leaderboard candidates
        run: npm run scan
      - name: Upload discovery dataset
        uses: actions/upload-artifact@v4
        with:
          name: polymarket-candidate-discovery
          path: data/discovery.json
          if-no-files-found: error
          retention-days: 14
