name: Scan, validate, and publish dashboard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/discover.yml"
      - "scanner/**"
      - "site/**"
      - "package.json"

concurrency:
  group: polymarket-candidate-discovery-v4
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  discover-and-qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run tests and syntax checks
        run: |
          npm test
          npm run check
      - name: Discover up to 1,000 candidate wallets
        run: npm run scan
        env:
          SCANNER_MAX_CANDIDATES: 1000
      - name: Verify settlements and build qualified monthly Top 100
        run: npm run qualify
        env:
          SCANNER_CONCURRENCY: 12
          SCANNER_API_INTERVAL_MS: 100
          NODE_OPTIONS: --max-old-space-size=6144
      - name: Build same-side consensus and high-multiplier combos
        run: npm run consensus
        env:
          SCANNER_CONCURRENCY: 12
          NODE_OPTIONS: --max-old-space-size=6144
      - name: Validate every dashboard data file exists and parses
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, existsSync } from 'node:fs';
          const required = ['status.json','qualification.json','week.json','month.json','consensus.json'];
          for (const name of required) {
            const path = `data/${name}`;
            if (!existsSync(path)) throw new Error(`Missing required publication file: ${path}`);
            JSON.parse(readFileSync(path, 'utf8'));
          }
          const status = JSON.parse(readFileSync('data/status.json', 'utf8'));
          const qualification = JSON.parse(readFileSync('data/qualification.json', 'utf8'));
          const monthly = JSON.parse(readFileSync('data/month.json', 'utf8'));
          const consensus = JSON.parse(readFileSync('data/consensus.json', 'utf8'));
          if (status.state !== 'success' || status.validation?.passed !== true) throw new Error('Status is not validated');
          if (qualification.validation?.passed !== true) throw new Error('Qualification is not validated');
          if (!Array.isArray(monthly.traders) || monthly.validation?.passed !== true) throw new Error('Monthly Top 100 data is invalid');
          if (consensus.validation?.passed !== true || !Array.isArray(consensus.signals)) throw new Error('Consensus data is invalid');
          console.log(`Publication payload verified: ${monthly.traders.length} monthly traders, ${consensus.signals.length} consensus signals.`);
          NODE
      - name: Upload validated scanner outputs and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: polymarket-qualified-scanner-output
          path: |
            data/discovery.json
            data/qualification.json
            data/qualification-incomplete.json
            data/week.json
            data/month.json
            data/consensus.json
            data/status.json
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    needs: discover-and-qualify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out dashboard
        uses: actions/checkout@v4
      - name: Download this run's validated scanner data
        uses: actions/download-artifact@v4
        with:
          name: polymarket-qualified-scanner-output
          path: data
      - name: Assemble dashboard with matching scanner data
        run: |
          set -euo pipefail
          mkdir -p site/data
          for file in status.json qualification.json week.json month.json consensus.json; do
            test -s "data/$file"
            cp "data/$file" "site/data/$file"
          done
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const read = (name) => JSON.parse(readFileSync(`site/data/${name}`, 'utf8'));
          const status = read('status.json');
          const qualification = read('qualification.json');
          const monthly = read('month.json');
          const consensus = read('consensus.json');
          if (status.state !== 'success' || status.validation?.passed !== true ||
              qualification.validation?.passed !== true ||
              monthly.validation?.passed !== true || !Array.isArray(monthly.traders) ||
              consensus.validation?.passed !== true || !Array.isArray(consensus.signals)) {
            throw new Error('Refusing to deploy: dashboard data failed validation');
          }
          console.log(`Deploying matching scan: ${monthly.traders.length} monthly traders; ${consensus.signals.length} consensus signals.`);
          NODE
          test -s site/index.html
          test -s site/styles.css
          test -s site/app.js
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload dashboard and matching data
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy validated dashboard
        id: deployment
        uses: actions/deploy-pages@v4
