name: Top 1,000 wallet qualification diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run tests and syntax checks
        run: |
          npm test
          npm run check
      - name: Discover candidate wallets
        run: npm run scan
      - name: Audit a diagnostic batch of 1,000 wallets
        run: npm run qualify
        env:
          SCANNER_CONCURRENCY: 16
          SCANNER_API_INTERVAL_MS: 60
          SCANNER_MAX_CANDIDATES: 1000
          SCANNER_DIAGNOSTIC_LIMIT: 1000
          NODE_OPTIONS: --max-old-space-size=6144
      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wallet-qualification-sample
          path: data/qualification-diagnostic.json
          if-no-files-found: ignore
          retention-days: 14
