name: Small-sample wallet qualification

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run tests and syntax checks
        run: |
          npm test
          npm run check
      - name: Discover candidate wallets
        run: npm run scan
      - name: Audit a diagnostic sample of 100 wallets
        run: npm run qualify
        env:
          SCANNER_CONCURRENCY: 16
          SCANNER_API_INTERVAL_MS: 60
          SCANNER_DIAGNOSTIC_LIMIT: 100
          NODE_OPTIONS: --max-old-space-size=6144
      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wallet-qualification-sample
          path: data/qualification-diagnostic.json
          if-no-files-found: ignore
          retention-days: 14
